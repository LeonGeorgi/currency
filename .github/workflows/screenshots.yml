name: App screenshots

"on":
  push:
    branches: [main]
    paths:
      - 'Currency/**'
      - 'CurrencyWidget/**'
      - 'Shared/**'
      - 'CurrencyScreenshotTests/**'
      - 'Currency.xcodeproj/**'
      - 'scripts/**'
      - 'README.md'
      - '.github/workflows/screenshots.yml'
  pull_request:
    paths:
      - 'Currency/**'
      - 'CurrencyWidget/**'
      - 'Shared/**'
      - 'CurrencyScreenshotTests/**'
      - 'Currency.xcodeproj/**'
      - 'scripts/**'
      - 'README.md'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Show Xcode and simulator runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Capture all languages and publish thumbnails
        run: bash scripts/screenshots.sh
      - name: Upload generated gallery
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-gallery
          path: |
            README.md
            docs/screenshots/
          if-no-files-found: error
          retention-days: 14
      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-test-results
          path: build/Screenshots/Results.xcresult
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: capture
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Ignore screenshots from an outdated commit
        id: source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer commit is already on the branch; its run will publish the screenshots.'
          fi
      - name: Download generated gallery
        if: steps.source.outputs.current == 'true'
        uses: actions/download-artifact@v8
        with:
          name: screenshot-gallery
      - name: Commit updated images and README
        if: steps.source.outputs.current == 'true'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md docs/screenshots
          if git diff --cached --quiet; then
            echo 'Screenshots are unchanged.'
            exit 0
          fi
          git commit -m 'docs: update app screenshots'
          git push origin "HEAD:$TARGET_BRANCH"
