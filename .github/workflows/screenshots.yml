name: App screenshots

"on":
  push:
    branches: [main]
    paths:
      - 'Currency/**'
      - 'CurrencyWidget/**'
      - 'Shared/**'
      - 'CurrencyScreenshotTests/**'
      - 'Currency.xcodeproj/**'
      - 'scripts/**'
      - 'README.md'
      - '.github/workflows/screenshots.yml'
  pull_request:
    paths:
      - 'Currency/**'
      - 'CurrencyWidget/**'
      - 'Shared/**'
      - 'CurrencyScreenshotTests/**'
      - 'Currency.xcodeproj/**'
      - 'scripts/**'
      - 'README.md'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  # Let a Pages deployment finish; obsolete queued runs are skipped below.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Show Xcode and simulator runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Capture all languages and build screenshot site
        run: bash scripts/screenshots.sh
      - name: Upload generated gallery
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-gallery
          path: build/Screenshots/Site/
          if-no-files-found: error
          retention-days: 14
      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-test-results
          path: build/Screenshots/Results.xcresult
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: capture
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Ignore screenshots from an outdated commit
        id: source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer commit is already on the branch; its run will publish the screenshots.'
          fi
      - name: Download generated gallery
        if: steps.source.outputs.current == 'true'
        uses: actions/download-artifact@v8
        with:
          name: screenshot-gallery
          path: build/Screenshots/Site
      - name: Configure GitHub Pages
        if: steps.source.outputs.current == 'true'
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        if: steps.source.outputs.current == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/Screenshots/Site
          retention-days: 1
      - name: Deploy screenshot site
        if: steps.source.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
